name: Generate Jarvis signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate one signing keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate signing material
        env:
          KEY_ALIAS: jarvis
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/jarvis-signing-setup"
          mkdir -p "$output"

          # PKCS12 uses the same password for the store and the key.
          password="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -keystore "$output/jarvis.keystore" \
            -storetype PKCS12 \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Jarvis, O=Personal, C=US"

          base64 -w 0 "$output/jarvis.keystore" > "$output/KEYSTORE_BASE64.txt"
          {
            printf 'KEYSTORE_PASSWORD=%s\n' "$password"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$password"
          } > "$output/SIGNING_SECRETS.txt"

          chmod 600 "$output"/*
          {
            echo "## Jarvis signing material generated"
            echo
            echo "Download the jarvis-signing-setup artifact, add the four secrets, then delete the artifact."
            echo "Never commit or share the downloaded files."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private signing setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-signing-setup
          path: ${{ runner.temp }}/jarvis-signing-setup
          if-no-files-found: error
          retention-days: 1
